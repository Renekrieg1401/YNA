<title>Pflege-Faktencheck — Runder Aufkleber</title>
<style>
  /* Runder Aufkleber (45mm Durchmesser, Standard-Rundsticker-Groesse), QR-Code mit
     eingebettetem Marken-Logo in der Mitte (ERROR_CORRECT_H-QR, Logo-Badge 30% der QR-
     Breite -- unter der ~30%-Fehlerkorrektur-Grenze, per OpenCV real gegengetestet, nicht
     nur angenommen). Farbwerte/Logo-Kurven 1:1 aus index.html (GLOBAL_SOURCE_OF_TRUTH_
     MANDATE). Gebogener Markenname oben + Domain unten macht den Aufkleber auch ohne
     Scan sofort als "Pflege-Faktencheck" erkennbar (René-Vorgabe). */
  @page { size: 45mm 45mm; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { width: 45mm; height: 45mm; overflow: hidden; }
  .sticker {
    width: 45mm; height: 45mm; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 20%, #303F58 0%, #131B27 70%);
    border: 0.6mm solid; border-image: linear-gradient(135deg, #6B4423, #B87333, #E8C39E) 1;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .qr { width: 23mm; height: 23mm; border-radius: 2mm; }
  svg.ring-text { position: absolute; top: 0; left: 0; width: 45mm; height: 45mm; overflow: visible; }
  .ring-text text { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800;
    font-size: 3.9px; letter-spacing: 0.15px; fill: #E7E2D6; }
  .ring-text .sub { font-weight: 600; font-size: 2.85px; letter-spacing: 0.05px; fill: #E8C39E; }
</style>
